<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정상파 탐구 실험실</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#203047;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:#173d70;color:white;padding:24px max(20px,calc((100vw - 1100px)/2))}h1{margin:0 0 7px;font-size:28px}header p{margin:0;color:#d8e7ff}.wrap{max-width:1100px;margin:22px auto;padding:0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:white;color:#21436b;border:1px solid #d1deef}.tabs button.active{background:#245fa8;color:white}button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer}.panel{background:white;border:1px solid #dce5f1;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 3px 14px #1a3c6710}h2{margin:0 0 10px;font-size:22px}.desc{color:#52657d;line-height:1.7}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin:18px 0}.control{min-width:170px;flex:1}.control label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.control input{width:100%;accent-color:#287ac9}.control select{width:100%;padding:10px;border:1px solid #cbd8e8;border-radius:9px;background:white}.play{background:#287ac9;color:white}.secondary{background:#e8f1ff;color:#20548a}.plot{background:#f8fbff;border:1px solid #dce9f7;border-radius:14px;padding:12px}canvas{display:block;width:100%;height:290px}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:13px;color:#53657d;margin-top:8px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.stat{background:#f0f6fd;padding:13px;border-radius:12px}.stat small{color:#5e7188}.stat strong{display:block;font-size:22px;margin-top:6px;color:#164b87}.formula{background:#eef6ff;padding:17px;border-radius:12px;line-height:1.8;font-size:17px}.note{color:#5b6c7d;font-size:14px;line-height:1.7}.questions{border-top:1px solid #e4edf7;margin-top:20px;padding-top:16px}.questions button{background:#e7f2e9;color:#20623b}.answer{display:none;margin-top:10px;background:#f1f8f2;padding:12px;border-radius:10px;line-height:1.6}.answer.show{display:block}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}canvas{height:230px}h1{font-size:24px}.panel{padding:15px}}</style></head><body><header><h1>〰️ 정상파 탐구 실험실</h1><p>두 파동의 중첩부터 줄과 관의 고유 진동수까지 · 고등학교 물리학</p></header><main class="wrap"><nav class="tabs" id="tabs"><button data-mode="origin" class="active">① 정상파의 발생</button><button data-mode="string">② 줄의 정상파</button><button data-mode="closed">③ 한쪽 끝이 닫힌 관</button><button data-mode="open">④ 양쪽 끝이 열린 관</button></nav><section class="panel"><h2 id="heading"></h2><p class="desc" id="description"></p><div class="controls" id="controls"><div class="control" id="modeBox"><label for="harmonic">진동 모드</label><select id="harmonic"></select></div><div class="control" id="lengthBox"><label for="length">길이 L: <span id="lengthLabel"></span> m</label><input id="length" type="range" min="0.5" max="3" step="0.1" value="1"></div><div class="control" id="speedBox"><label for="speed">파동 속력 v: <span id="speedLabel"></span> m/s</label><input id="speed" type="range" min="50" max="400" step="10" value="340"></div><div class="control" id="timeBox"><label for="tempo">애니메이션 속도</label><input id="tempo" type="range" min="0.2" max="2" step="0.1" value="0.8"></div><button class="play" id="play">⏸ 일시정지</button><button class="secondary" id="reset">↺ 초기화</button></div><div class="plot"><canvas id="canvas" aria-label="정상파의 시간에 따른 진동과 마디 및 배를 보여주는 그래프"></canvas><div class="legend" id="legend"></div></div><div class="stats" id="stats"></div><div class="formula" id="formula"></div><p class="note" id="note"></p><div class="questions"><b id="question"></b><div style="margin-top:10px"><button id="reveal">해설 확인</button></div><div class="answer" id="answer"></div></div></section></main><script>
const $=id=>document.getElementById(id);const canvas=$('canvas'),ctx=canvas.getContext('2d');let mode='origin',running=true,phase=0,last=0;const info={origin:['정상파는 어떻게 발생할까요?','진폭과 진동수가 같은 두 파동이 반대 방향으로 진행하면서 중첩됩니다. 두 진행파와 합성파를 비교해 보세요.'],string:['양 끝이 고정된 줄','양 끝은 항상 마디입니다. 진동 모드를 높이면 줄 안에 들어가는 반파장의 개수가 늘어납니다.'],closed:['한쪽 끝이 닫힌 관','닫힌 끝(왼쪽)은 공기 입자 변위의 마디, 열린 끝(오른쪽)은 배입니다. 홀수 배 진동만 가능합니다.'],open:['양쪽 끝이 열린 관','열린 양 끝은 공기 입자 변위의 배입니다. 공기 입자의 좌우 진동을 세로 방향 그래프로 표현합니다.']};
function harmonic(){return Number($('harmonic').value)}function update(){let n=harmonic(),L=+$('length').value,v=+$('speed').value; $('heading').textContent=info[mode][0];$('description').textContent=info[mode][1];$('lengthLabel').textContent=L.toFixed(1);$('speedLabel').textContent=v;$('modeBox').style.display=mode==='origin'?'none':'';$('lengthBox').style.display=mode==='origin'?'none':'';$('speedBox').style.display=mode==='origin'?'none':'';let k=mode==='closed'?2*n-1:n;let lambda=mode==='closed'?4*L/k:2*L/k;let f=v/lambda;let f1=mode==='closed'?v/(4*L):v/(2*L);$('stats').innerHTML=mode==='origin'?[['진행파 A','→'],['진행파 B','←'],['합성파','정상파'],['마디 간격','λ/2']].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join(''):[['진동 모드',mode==='closed'?`${k}배 진동`:`${n}배 진동`],['파장 λ',`${lambda.toFixed(3)} m`],['진동수 f',`${f.toFixed(2)} Hz`],['기본 진동수 f₁',`${f1.toFixed(2)} Hz`]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');$('formula').innerHTML=mode==='origin'?'y₁ = A sin(kx − ωt), &nbsp; y₂ = A sin(kx + ωt)<br><b>y = y₁ + y₂ = 2A sin(kx) cos(ωt)</b>':mode==='closed'?`<b>L = ${k}λ/4 &nbsp; → &nbsp; λ = 4L/${k}</b><br>f₁ = v/(4L), &nbsp; f = ${k}f₁ &nbsp; (1, 3, 5, 7, …배 진동)`: `<b>L = ${n}λ/2 &nbsp; → &nbsp; λ = 2L/${n}</b><br>f₁ = v/(2L), &nbsp; f = ${n}f₁`; $('note').textContent=mode==='origin'?'파란색·주황색: 서로 반대 방향의 진행파 / 보라색: 두 파동의 합성파. 마디의 변위는 항상 0입니다.':mode==='string'?'파란 점 = 마디, 주황 점 = 배. 줄의 양 끝은 움직이지 않습니다.': '이 그래프는 음압이 아닌 공기 입자의 변위를 나타냅니다. 실제 공기 입자는 관의 길이 방향으로 진동합니다. 관 끝의 경계 조건은 이상적인 모델이며 끝 보정은 무시합니다.';$('question').textContent=mode==='origin'?'탐구 질문: 합성파의 마디는 왜 움직이지 않을까요?':mode==='closed'?'탐구 질문: 이 관에서는 왜 2배 진동이 나타나지 않을까요?':'탐구 질문: 길이를 2배로 늘리고 파동 속력을 일정하게 유지하면 진동수는 어떻게 변할까요?';$('answer').textContent=mode==='origin'?'두 진행파가 마디 위치에서 언제나 반대 변위로 중첩되어 합성 변위가 0이 되기 때문입니다.':mode==='closed'?'닫힌 끝의 변위 마디와 열린 끝의 변위 배 조건을 동시에 만족하려면 관의 길이가 파장의 1/4, 3/4, 5/4…배여야 합니다. 따라서 2배 진동은 허용되지 않습니다.':'같은 진동 모드에서 파장은 길이에 비례하므로 진동수는 절반이 됩니다.';$('answer').classList.remove('show');$('legend').innerHTML=mode==='origin'?'<span><i class="dot" style="background:#2985d1"></i>오른쪽 진행파</span><span><i class="dot" style="background:#ee8a40"></i>왼쪽 진행파</span><span><i class="dot" style="background:#8a54c8"></i>합성파</span>':'<span><i class="dot" style="background:#2869c7"></i>마디</span><span><i class="dot" style="background:#ee9140"></i>배</span><span>회색 점선: 최대 진폭의 포락선</span>';}
function fillModes(){let old=harmonic()||1;$('harmonic').innerHTML='';for(let n=1;n<=6;n++){let k=mode==='closed'?2*n-1:n;let op=document.createElement('option');op.value=n;op.textContent=mode==='closed'?`${k}배 진동 (${n}번째 허용 모드)`:`${n}배 진동`; $('harmonic').appendChild(op)}$('harmonic').value=Math.min(old,6)}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));fillModes();update()}
function draw(){let dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=w*dpr;canvas.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let left=35,right=w-35,mid=h/2,amp=Math.min(65,h*.29),width=right-left;ctx.strokeStyle='#bdcadb';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(left,mid);ctx.lineTo(right,mid);ctx.stroke();ctx.setLineDash([]);const path=(fn,color,thick=3,dash=false)=>{ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=thick;ctx.setLineDash(dash?[5,5]:[]);for(let i=0;i<=500;i++){let x=i/500,y=fn(x);i?ctx.lineTo(left+x*width,mid-y*amp):ctx.moveTo(left,mid-y*amp)}ctx.stroke();ctx.setLineDash([])};if(mode==='origin'){let cycles=2;path(x=>.48*Math.sin(2*Math.PI*cycles*x-phase),'#2985d1',2);path(x=>.48*Math.sin(2*Math.PI*cycles*x+phase),'#ee8a40',2);path(x=>.96*Math.sin(2*Math.PI*cycles*x)*Math.cos(phase),'#8a54c8',4);for(let j=0;j<=4;j++)point(j/4,mid,'#2869c7','마디',j%2===0?-92:92)}else{let n=harmonic(),k=mode==='closed'?2*n-1:n;let shape=mode==='string'?x=>Math.sin(n*Math.PI*x):mode==='closed'?x=>Math.sin(k*Math.PI*x/2):x=>Math.cos(n*Math.PI*x);path(x=>shape(x), '#b2bac7',1.4,true);path(x=>-shape(x),'#b2bac7',1.4,true);path(x=>shape(x)*Math.cos(phase),'#287ac9',4);let nodes=[],antis=[];if(mode==='string'){for(let j=0;j<=n;j++)nodes.push(j/n);for(let j=0;j<n;j++)antis.push((j+.5)/n)}else if(mode==='closed'){for(let j=0;j<=k;j++){let x=j/k;if(j%2===0)nodes.push(x);else antis.push(x)}}else{for(let j=0;j<=n;j++)antis.push(j/n);for(let j=0;j<n;j++)nodes.push((j+.5)/n)}nodes.forEach(x=>point(x,mid,'#2869c7','마디',-100));antis.forEach(x=>point(x,mid,'#ee9140','배',100));ctx.strokeStyle='#506b8b';ctx.lineWidth=5;if(mode==='string'){[left,right].forEach(x=>{ctx.beginPath();ctx.moveTo(x,mid-75);ctx.lineTo(x,mid+75);ctx.stroke()})}else{ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(left,mid-82);ctx.lineTo(right,mid-82);ctx.moveTo(left,mid+82);ctx.lineTo(right,mid+82);if(mode==='closed'){ctx.moveTo(left,mid-82);ctx.lineTo(left,mid+82)}ctx.stroke();ctx.font='13px sans-serif';ctx.fillStyle='#506b8b';ctx.textAlign='center';ctx.fillText(mode==='closed'?'닫힌 끝':'열린 끝',left+20,mid-91);ctx.fillText('열린 끝',right-20,mid-91)}}ctx.fillStyle='#61758b';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('0',left,h-12);ctx.fillText('L',right,h-12);
function point(x,y,color,label,dy){let px=left+x*width;ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,y,4.3,0,Math.PI*2);ctx.fill();ctx.font='12px sans-serif';ctx.textAlign='center';if(width>430||x>.08&&x<.92)ctx.fillText(label,px,y+(dy<0?-17:23))}}
function animate(t){if(running){phase+=(Math.min(40,t-last||16)/1000)*3*(+$('tempo').value)}last=t;draw();requestAnimationFrame(animate)}$('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode)});['harmonic','length','speed','tempo'].forEach(id=>$(id).addEventListener('input',()=>{if(id!=='tempo')update()}));$('play').onclick=()=>{running=!running;$('play').textContent=running?'⏸ 일시정지':'▶ 재생'};$('reset').onclick=()=>{$('length').value=1;$('speed').value=340;$('tempo').value=.8;$('harmonic').value=1;phase=0;update()};$('reveal').onclick=()=>$('answer').classList.toggle('show');setMode('origin');requestAnimationFrame(animate);
</script></body></html>
